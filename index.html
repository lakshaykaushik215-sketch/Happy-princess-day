<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Princess Day 👑</title>
  <meta name="description" content="A little surprise for Princess Day: a love letter, music and memories." />
  <meta name="theme-color" content="#fff3f6" />
  <meta property="og:title" content="Happy Princess Day 👑" />
  <meta property="og:description" content="A little surprise for Princess Day: a love letter, music and memories." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👑%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <main>
    <!-- Screen 1: intro -->
    <section id="intro" class="screen">
      <div class="crown" aria-hidden="true">👑</div>
      <p class="eyebrow">A note for you</p>
      <h1 id="introTitle" class="script">Hey Princess! 💕</h1>
      <p id="introText" class="lead"></p>
      <button id="openBtn" class="btn" type="button">Open My Heart 💖</button>
      <p class="small">Made with love, only for you 💕</p>
    </section>

    <!-- Screen 2: the surprise -->
    <section id="experience" class="experience" hidden>
      <button id="musicBtn" class="music-btn" type="button" aria-label="Toggle music" aria-pressed="true">🎵</button>

      <header class="exp-head reveal">
        <p class="eyebrow" id="eventLabel"></p>
        <h2 class="script" id="expTitle"></h2>
      </header>

      <section class="block reveal">
        <h3>A Letter For You 💌</h3>
        <div class="letter" id="letter">
          <div class="letter-body" id="letterText"></div>
          <button class="seal-btn" id="sealBtn" type="button">
            <span class="seal" aria-hidden="true">💌</span>
            <span>Tap to open</span>
          </button>
        </div>
      </section>

      <section class="block reveal">
        <h3>Our Little Moments 🌸</h3>
        <div class="memories" id="memories"></div>
        <p class="hint">Swipe →</p>
      </section>

      <section class="block reveal">
        <h3>Why You're My Princess 👑</h3>
        <ul class="reasons" id="reasons"></ul>
      </section>

      <section class="block final reveal">
        <h3 id="finalTitle"></h3>
        <p id="finalText"></p>
        <button id="hugBtn" class="btn" type="button">Send a hug 🤗</button>
      </section>

      <footer id="footerText"></footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
